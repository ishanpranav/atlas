<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />
    <meta name="author"
          content="Ishan Pranav" />
    <meta name="description"
          content="A mult-user dungeon role-playing game." />
    <title>Arcane Dominion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!--<link href="styles/index.css"
          rel="stylesheet"
          type="text/css" />-->
    <link rel="stylesheet"
          href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
          integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
          crossorigin="anonymous">
</head>
<body>
    <div class="container col-lg-8 mx-auto p-4 py-md-5">
        <header class="d-flex align-items-center pb-3 border-bottom">
            <h1 class="fs-4">Arcane Dominion</h1>
        </header>
        <main>
            <form id="mainForm" action="" class="d-flex flex-column h-100 p-3">
                <div class="form-floating">
                    <textarea id="outputTextarea"
                              class="form-control flex-grow-1 mb-2 h-100"
                              placeholder="Storyteller"
                              readonly="readonly"
                              style="overflow: scroll;">To conserve resources, our storyteller takes short naps whenever there isn't much activity on the server. It may take a few minutes for him to wake up...</textarea>
                    <label for="outputTextarea">Storyteller</label>
                </div>
                <div class="input-group">
                    <div class="form-floating">
                        <input type="text" id="inputInput" class="form-control" placeholder="Response">
                        <label for="inputInput">Response</label>
                    </div>
                    <input type="submit" class="btn btn-primary" />
                </div>
            </form>
        </main>
        <footer class="pt-5 my-5 text-muted border-top">
            Copyright &copy; 2025 Ishan Pranav
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="scripts/index.js"
            type="text/javascript"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
            integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
            crossorigin="anonymous"></script>
</body>
</html>
